# Serviço de rostos do NossaFoto. Publicado pelo workflow .github/workflows/worker.yml.
app = "nossafoto-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"  # relativo a este fly.toml; o contexto (.) é a raiz do repo

[http_service]
  internal_port = 8080
  force_https = true
  # Sempre ligado: a fila de indexação é consumida por este processo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
