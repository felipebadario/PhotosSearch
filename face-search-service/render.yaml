# Render Free, sem disco pago. Fotos/índice/modelos são gerados no BUILD.
# Este serviço é o Face Search Service: engine interna consumida pelo SaaS
# (web/), não o produto em si. Vive em face-search-service/ desde que o
# Descomplica Fotos passou a ser um monorepo (ver docs/architecture.md).
services:
  - type: web
    name: encontre-suas-fotos
    runtime: python
    plan: free
    region: virginia
    rootDir: face-search-service
    numInstances: 1
    autoDeployTrigger: off
    # InsightFace declara opencv-python. Substitua por headless após resolver
    # suas dependências; nunca mantenha as duas variantes de cv2 instaladas.
    buildCommand: >-
      python -m pip install -r requirements.txt &&
      python -m pip uninstall -y opencv-python &&
      python -m pip install opencv-python-headless==5.0.0.93 &&
      python build_render.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: MVP_REQUIRE_READY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
