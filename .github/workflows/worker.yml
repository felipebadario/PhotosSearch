name: Worker de rostos
on:
  push:
    branches: [main]
    paths: ["worker/**", "face-search-service/app/**", "web/drizzle/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", "face-search-service/app/**", "web/drizzle/**", ".github/workflows/worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nossafoto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nossafoto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Migrações (o worker usa as tabelas do web)
        working-directory: web
        run: npm ci && npm run db:migrate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - name: Testes do worker
        working-directory: worker
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: worker-deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Segredos do Fly configurados?
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN ausente: deploy do worker ignorado."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.go == 'true'
      - name: Criar o app se ainda não existe
        if: steps.gate.outputs.go == 'true'
        run: flyctl status --app nossafoto-worker >/dev/null 2>&1 || flyctl apps create nossafoto-worker
      - name: Segredos do serviço
        if: steps.gate.outputs.go == 'true'
        env:
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for v in DATABASE_URL WORKER_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then echo "Segredo $v ausente no GitHub."; exit 1; fi
          done
          printf '%s' "DATABASE_URL=$DATABASE_URL
          WORKER_SECRET=$WORKER_SECRET
          R2_ACCOUNT_ID=$R2_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_BUCKET=$R2_BUCKET" | flyctl secrets import --app nossafoto-worker --stage
      - name: Publicar
        if: steps.gate.outputs.go == 'true'
        run: flyctl deploy --app nossafoto-worker --config worker/fly.toml --remote-only .
